<!-- templates\reports\includes\_summary_cards.html ...
   ... se utiliza para:
   mostrar un resumen general de la aplicación mediante tarjetas con información sobre proyectos, tareas, productividad y usuarios,
   permitiendo acceder directamente a las secciones correspondientes.
   ... se utiliza en los archivos:
   templates\reports\report.html → mediante la inclusión de las tarjetas de resumen en la página de informes.
   ... enlaza con las url:
   'project_list' → accede al listado de proyectos.
   'task_list' → accede al listado de tareas.
   'kanban' → accede al tablero Kanban.
   'manage' → accede a la sección de Gestión. -->

<div class="card shadow-sm mb-4">
  <div class="card-header"><h4 class="ms-1 mb-0">Resumen</h4></div>
  <div class="card-body">
    <div class="row g-3">
      <!-- Proyectos -->
      <div class="col-lg-3 col-md-6">
        <div class="card h-100 report-summary-card">
          <div class="card-body d-flex align-items-center justify-content-center">
            <a href="/projects/" class="report-summary-icon bg-primary-subtle text-primary">
              <i class="bi bi-folder2-open"></i>
            </a>
            <div class="ms-3">
              <div class="text-muted small">Proyectos</div>
              <div>
                <span class="text-muted small">Activos:</span>
                <span class="report-summary-value">
                  {{ active_projects }}
                </span>
              </div>
              <div>
                <span class="text-muted small">Archivados:</span>
                <span class="report-summary-value">
                  {{ archived_projects }}
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Tareas -->
      <div class="col-lg-3 col-md-6">
        <div class="card h-100 report-summary-card">
          <div class="card-body d-flex align-items-center justify-content-center">
            <a href="/tasks/" class="report-summary-icon bg-success-subtle text-success">
              <i class="bi bi-list-check"></i>
            </a>
            <div class="ms-3">
              <div class="text-muted small">Tareas</div>
              <div>
                <span class="text-muted small">Activas:</span>
                <span class="report-summary-value">
                  {{ active_tasks }}
                </span>
              </div>
              <div>
                <span class="text-muted small">Completadas:</span>
                <span class="report-summary-value">
                  {{ completed_tasks }}
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Productividad -->
      <div class="col-lg-3 col-md-6">
        <div class="card h-100 report-summary-card">
          <div class="card-body d-flex align-items-center justify-content-center">
            <a href="/kanban/" class="report-summary-icon bg-info-subtle text-info">
              <i class="bi bi-graph-up-arrow"></i>
            </a>
            <div class="ms-3">
              <div class="text-muted small">Completado</div>
              <div class="report-summary-value">
                {{ completed_percentage }}%
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Usuarios -->
      <div class="col-lg-3 col-md-6">
        <div class="card h-100 report-summary-card">
          <div class="card-body d-flex align-items-center justify-content-center">
            <a href="/manage/" class="report-summary-icon bg-warning-subtle text-warning">
              <i class="bi bi-people-fill"></i>
            </a>
            <div class="ms-3">
              <div class="text-muted small">Usuarios</div>
              <div class="report-summary-value">
                {{ total_users }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
